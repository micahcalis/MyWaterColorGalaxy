version: '3'

vars:
  PROJECT_NAME: "MyWatercolorGalaxy"
  BUILD_DIR: "build"
  GAME_DIR: "bin"
  BUILD_TYPE: '{{.BUILD_TYPE | default "Debug"}}'
  # 1. Added a JOBS variable to limit Clang threads and save your RAM!
  JOBS: '{{.JOBS | default "4"}}' 

tasks:
  configure:
    desc: Configure the project using CMake and Ninja
    cmds:
      - cmake -S . -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE={{.BUILD_TYPE}}
    status:
      - test -f {{.BUILD_DIR}}/build.ninja

  build:
    desc: Build the project
    deps: [configure]
    cmds:
      # 2. Passed the JOBS variable into the build command
      - cmake --build {{.BUILD_DIR}} --config {{.BUILD_TYPE}} -j {{.JOBS}}

  run:
    desc: Run the compiled executable
    deps: [build]
    cmds:
      - ./{{.GAME_DIR}}/{{.PROJECT_NAME}}

  clean:
    desc: Remove the build directory
    cmds:
      # 3. Made the clean task 100% cross-platform
      - cmake -E rm -rf {{.BUILD_DIR}}