version: '3'

vars:
  PROJECT_NAME: "MyWatercolorGalaxy"
  BUILD_DIR: "build"
  GAME_DIR: "bin"
  BUILD_TYPE: '{{.BUILD_TYPE | default "Debug"}}'
  # 1. Added a JOBS variable to limit Clang threads and save your RAM!
  JOBS: '{{.JOBS }}' 

tasks:
  configure:
    desc: Configure the project using CMake and Ninja
    cmds:
      - cmake -S . -B {{.BUILD_DIR}} -G Ninja -DCMAKE_BUILD_TYPE={{.BUILD_TYPE}}
    status:
      - test -f {{.BUILD_DIR}}/build.ninja

  build:
    desc: Build the project
    deps: [configure]
    cmds:
      # 2. Passed the JOBS variable into the build command
      - cmake --build {{.BUILD_DIR}} --config {{.BUILD_TYPE}} -j {{.JOBS}}

  run:
    desc: Run the compiled executable
    deps: [build]
    cmds:
      - ./{{.GAME_DIR}}/{{.PROJECT_NAME}}

  clean:
    desc: Remove the build directory
    cmds:
      # 3. Made the clean task 100% cross-platform
      - cmake -E rm -rf {{.BUILD_DIR}}

  # example: task generateatlas FONT=MirandaSans
  generateatlas:
    desc: "Generate an MSDF font atlas. Usage: task generateatlas FONT=Roboto-Regular"
    vars:
      FONT: '{{.FONT | default "Roboto-Regular"}}'
      # This points to the root assets folder where your Taskfile lives
      FONT_DIR: 'assets/fonts' 
    cmds:
      - echo "Generating MSDF Font Atlas for {{.FONT}} in root assets folder..."
      # Added -imageout to explicitly place the PNG next to the JSON
      - tools/msdf-atlas-gen/msdf-atlas-gen.exe -font {{.FONT_DIR}}/{{.FONT}}.ttf -type msdf -size 32 -format png -imageout {{.FONT_DIR}}/{{.FONT}}.png -json {{.FONT_DIR}}/{{.FONT}}.json
      - echo "Successfully generated {{.FONT}}.png and {{.FONT}}.json in {{.FONT_DIR}}!"

  slangreload:
    desc: "Forcefully kill the Slang language server so VS Code auto-restarts it"
    cmds:
      - cmd: taskkill /IM slangd.exe /F
        ignore_error: true
      - echo "Slang language server sniped! VS Code should spin up a fresh instance immediately."